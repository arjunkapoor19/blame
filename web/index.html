<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ah · agent history</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Crect x='8' y='8' width='4' height='16' rx='2' fill='%23a78bfa'/%3E%3Crect x='14' y='12' width='4' height='12' rx='2' fill='%2334d399'/%3E%3Crect x='20' y='6' width='4' height='18' rx='2' fill='%23fb923c'/%3E%3C/svg%3E" />
    <script>
      // set the theme before the first paint, so there's no flash
      try {
        var t = localStorage.getItem("ah-theme")
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
